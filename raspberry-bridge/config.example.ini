; Copia este archivo a "config.ini" y edita los valores.
;   cp config.example.ini config.ini

[mqtt]
; Si el puente corre en la MISMA Raspberry que Mosquitto, usa localhost.
; Con mTLS, "host" debe coincidir con el CN/SAN del certificado del broker
; (suele ser la IP o el hostname de la Pi), o activa tls_insecure abajo.
host = localhost
port = 8883

; Tópico donde publica la ESP32. El "+" es comodín de un nivel.
; Con "planta/+/sensores", el segmento del medio es el código de la maceta.
topic = planta/+/sensores

; --- mTLS: rutas a los certificados (en la Raspberry) ---
ca_cert = /etc/mosquitto/certs/ca.crt
client_cert = /etc/mosquitto/certs/bridge.crt
client_key = /etc/mosquitto/certs/bridge.key

; Solo para pruebas locales: ignora la verificación del hostname del broker.
tls_insecure = false

[firebase]
service_account = /home/pi/sira-bridge/serviceAccountKey.json
collection = plants

[bridge]
; El código de la maceta se toma del tópico: planta/<CODIGO>/sensores -> índice 1
device_id_topic_index = 1

[payload]
; --- Nombres de los campos que envía TU firmware (ESP-IDF) ---
field_temperature = temp_c
field_water_pct   = nivel_pct
field_soil_mv     = hum_mv
field_light_lux   = lux
field_valves      = valvulas

; --- Conversión humedad de suelo (mV -> %) ---
; Mayor mV = más húmedo. Ajusta con tus umbrales reales (en tu firmware:
; <=300 seco, <=700 húmedo). Aquí: dry_mv -> 0%, wet_mv -> 100%.
soil_dry_mv = 300
soil_wet_mv = 700

; --- Conversión luz (lux -> %) en escala logarítmica ---
; light_full_lux = los lux que equivalen al 100%. 10000 ≈ "sol parcial".
light_full_lux = 10000
